name: CMake-Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  ARCH: x64

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Install vcpkg dependencies
      run: |
        vcpkg install glib libpng --triplet=${{env.ARCH}}-windows
        vcpkg integrate install
    - name: Install xsltproc
      run: choco install xsltproc
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install setuptools
      run: python -m pip install --upgrade pip build setuptools
    - name: Build and Install using CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A ${{env.ARCH}} -DBUILD_STATIC=OFF -DBUILD_LENSTOOL=OFF -DBUILD_TESTS=ON -DINSTALL_PYTHON_MODULE=OFF -DCMAKE_INSTALL_PREFIX=install -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DGLIB2_BASE_DIR=c:/vcpkg/installed/${{env.ARCH}}-windows
        cmake --build . --config ${{env.BUILD_TYPE}}
        cmake --build . --target install
    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Consumer header smoke test
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
        $include = "install\include"
        $cSrc = "#include <lensfun/lensfun.h>`nint main(void){ return 0; }"
        $cppSrc = "#include <lensfun/lensfun.h>`nint main(){ return 0; }"
        Set-Content -Path consumer.c -Value $cSrc
        Set-Content -Path consumer.cpp -Value $cppSrc
        cmd /c "`"$vcvars`" x64 && cl /I`"$include`" /c consumer.c && cl /std:c++17 /I`"$include`" /c consumer.cpp"
        if ($LASTEXITCODE -ne 0) { throw "consumer header smoke test failed" }
      
