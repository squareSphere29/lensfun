name: CMake-MSYS2

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release

jobs:
  msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            cmake:p
            cc:p
            glib2:p
            libxml2:p
            python-setuptools:p
            python-build:p

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTS=ON -DPython3_EXECUTABLE=${MINGW_PREFIX}/bin/python.exe
      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Install
        run: cmake --build build --target install
      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

      - name: Consumer header smoke test
        run: |
          printf '#include <lensfun/lensfun.h>\nint main(void){ return 0; }\n' > /tmp/consumer.c
          printf '#include <lensfun/lensfun.h>\nint main(){ return 0; }\n' > /tmp/consumer.cpp
          gcc -x c -I install/include -c /tmp/consumer.c -o /tmp/consumer_c.o
          g++ -std=c++17 -I install/include -c /tmp/consumer.cpp -o /tmp/consumer_cpp.o
